<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>3TX - اختصار روابط حقيقي</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        /* نفس التصميم السابق (أسود وفيروزي) */
        body { background: #0f0f0f; color: white; font-family: sans-serif; text-align: center; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: #1a1a1a; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; border: 1px solid #333; }
        input { width: 100%; padding: 15px; margin: 15px 0; border-radius: 10px; border: 1px solid #444; background: #222; color: white; box-sizing: border-box; }
        .btn { background: #00f2ea; color: black; padding: 15px; width: 100%; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        #result { margin-top: 20px; padding: 10px; border: 1px dashed #00f2ea; display: none; word-break: break-all; }
    </style>
</head>
<body>

<div class="box">
    <h1>3TX</h1>
    <div id="main-ui">
        <input type="text" id="urlInput" placeholder="ضع الرابط الطويل هنا">
        <button class="btn" onclick="shorten()">اختصار الرابط</button>
        <div id="result">
            <p>الرابط القصير:</p>
            <strong id="shortUrl"></strong>
        </div>
    </div>

    <div id="redirect-ui" style="display:none;">
        <h3>جاري التحويل...</h3>
        <div id="timer" style="font-size: 30px; color: #ff0050;">10</div>
    </div>
</div>

<script>
    // --- (هنا تضع معلومات Firebase الخاصة بك) ---
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        databaseURL: "YOUR_DATABASE_URL",
        projectId: "YOUR_PROJECT_ID",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 1. وظيفة الاختصار (خزن في القاعدة)
    function shorten() {
        const longUrl = document.getElementById('urlInput').value;
        if(!longUrl) return alert("حط رابط!");

        const id = Date.now().toString().slice(-5); // يسوي رقم قصير من 5 مراتب
        db.ref('links/' + id).set(longUrl).then(() => {
            const short = window.location.href.split('?')[0] + "?id=" + id;
            document.getElementById('shortUrl').innerText = short;
            document.getElementById('result').style.display = 'block';
        });
    }

    // 2. وظيفة التحويل (قراءة من القاعدة)
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    if(id) {
        document.getElementById('main-ui').style.display = 'none';
        document.getElementById('redirect-ui').style.display = 'block';

        db.ref('links/' + id).once('value').then((snapshot) => {
            const target = snapshot.val();
            if(target) {
                let time = 10;
                let inter = setInterval(() => {
                    time--;
                    document.getElementById('timer').innerText = time;
                    if(time <= 0) {
                        clearInterval(inter);
                        window.location.href = target;
                    }
                }, 1000);
            } else {
                alert("الرابط غير موجود!");
            }
        });
    }
</script>
</body>
</html>
